
name: Build BiruFinance 3.2 APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract BiruFinance source
        run: |
          mkdir -p source
          unzip -o BiruFinance_3.2.0_LiquidGlass_Refined.zip -d source
          find source -name settings.gradle -print
      - name: Locate Gradle project
        run: |
          SETTINGS=$(find source -name settings.gradle -type f | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle tidak ditemukan di dalam ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiruFinance-3.2.0-debug-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
