
name: Build BiruFinance 3.5.0 APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract BiruFinance 3.5.0 source
        run: |
          mkdir -p source
          unzip -o BiruFinance_3.5.0_SmartImport_Source.zip -d source
          test -f source/settings.gradle
          test -f source/app/src/main/java/com/birufinance/app/MainActivity.java

      - name: Build debug APK
        run: gradle --no-daemon -p source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiruFinance-3.5.0-debug-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
